<!DOCTYPE html>
<html>
<head>
  <title>SpendSmart</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFx9kTF5bdDpmyB6WA-lDPRHU0G5LlO4I",
      authDomain: "spendsmart-65dcd.firebaseapp.com",
      projectId: "spendsmart-65dcd",
      storageBucket: "spendsmart-65dcd.firebasestorage.app",
      messagingSenderId: "1085726370789",
      appId: "1:1085726370789:web:72f978928a95fc6d1add0c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window._auth = auth;
    window._db = db;
    window._provider = provider;
    window._signInWithPopup = signInWithPopup;
    window._signOut = signOut;
    window._onAuthStateChanged = onAuthStateChanged;
    window._firestoreOps = { collection, addDoc, getDocs, deleteDoc, doc };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; }
    .app { max-width: 900px; margin: 0 auto; padding: 20px; }
    .header { background: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .logo { font-size: 20px; font-weight: bold; color: #185FA5; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #555; }
    .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #185FA5; color: white; }
    .btn-danger { background: #fff; border: 1px solid #ddd; color: #555; }
    .tabs { display: flex; gap: 4px; background: white; border-radius: 10px; padding: 4px;
      margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px;
      cursor: pointer; font-size: 14px; color: #666; }
    .tab.active { background: #185FA5; color: white; font-weight: bold; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .metric-label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .metric-value { font-size: 24px; font-weight: bold; color: #222; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .card h3 { font-size: 14px; color: #888; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; margin-bottom: 10px; }
    .expense-item { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #f8f8f8; border-radius: 8px; margin-bottom: 8px; }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .del-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 18px; }
    .del-btn:hover { color: #e55; }
    .insight { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; display: flex; gap: 8px; }
    .insight.warn { background: #fff8e1; color: #7a5500; }
    .insight.good { background: #e8f5e9; color: #2e7d32; }
    .insight.info { background: #e3f2fd; color: #0d47a1; }
    .login-page { max-width: 360px; margin: 100px auto; text-align: center; }
    .login-page h1 { font-size: 28px; color: #185FA5; margin-bottom: 8px; }
    .login-page p { color: #888; margin-bottom: 30px; }
    .google-btn { background: white; border: 1px solid #ddd; padding: 12px 24px;
      border-radius: 10px; font-size: 15px; cursor: pointer; width: 100%; display: flex;
      align-items: center; justify-content: center; gap: 10px; }
    .google-btn:hover { background: #f5f5f5; }
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const CAT_COLORS = {
  Food: '#3266ad', Travel: '#E24B4A', Shopping: '#EF9F27',
  Bills: '#639922', Health: '#D4537E', Entertainment: '#7F77DD', Other: '#888780'
};

function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('dashboard');
  const [expenses, setExpenses] = useState([]);
  const [title, setTitle] = useState('');
  const [amount, setAmount] = useState('');
  const [category, setCategory] = useState('Food');
  const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
  const [insights, setInsights] = useState([]);
  const [insightsLoading, setInsightsLoading] = useState(false);
  const barChartRef = useRef(null);
  const barChartInstance = useRef(null);

  useEffect(() => {
    window._onAuthStateChanged(window._auth, u => {
      setUser(u);
      setLoading(false);
      if (u) loadExpenses(u.uid);
    });
  }, []);

  useEffect(() => {
    if (activeTab === 'dashboard' && expenses.length > 0) {
      setTimeout(() => renderChart(), 100);
    }
    return () => {
      if (barChartInstance.current) {
        barChartInstance.current.destroy();
        barChartInstance.current = null;
      }
    };
  }, [activeTab, expenses]);

  const renderChart = () => {
    const canvas = document.getElementById('barChart');
    if (!canvas) return;
    if (barChartInstance.current) barChartInstance.current.destroy();
    const cats = Object.keys(CAT_COLORS);
    const totals = cats.map(c => expenses.filter(e => e.category === c).reduce((a, e) => a + e.amount, 0));
    barChartInstance.current = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: cats,
        datasets: [{ label: 'Spent (₹)', data: totals, backgroundColor: Object.values(CAT_COLORS) }]
      },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  };

  const loadExpenses = async (uid) => {
    const { collection, getDocs } = window._firestoreOps;
    const snap = await getDocs(collection(window._db, 'users', uid, 'expenses'));
    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setExpenses(data);
  };

  const addExpense = async () => {
    if (!title || !amount || isNaN(amount)) return alert('Fill in all fields!');
    const { collection, addDoc } = window._firestoreOps;
    const newExp = { title, amount: parseFloat(amount), category, date };
    const ref = await addDoc(collection(window._db, 'users', user.uid, 'expenses'), newExp);
    setExpenses(prev => [...prev, { id: ref.id, ...newExp }]);
    setTitle(''); setAmount('');
  };

  const deleteExpense = async (id) => {
    const { doc, deleteDoc } = window._firestoreOps;
    await deleteDoc(doc(window._db, 'users', user.uid, 'expenses', id));
    setExpenses(prev => prev.filter(e => e.id !== id));
  };

  const signIn = () => window._signInWithPopup(window._auth, window._provider);
  const logOut = () => window._signOut(window._auth);

  const getInsights = async () => {
    setInsightsLoading(true);
    const summary = Object.keys(CAT_COLORS).map(c => {
      const spent = expenses.filter(e => e.category === c).reduce((a, e) => a + e.amount, 0);
      return `${c}: ₹${spent}`;
    }).join(', ');
    try {
      const res = await fetch('http://localhost:3001/ai-insights', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ summary, total: expenses.reduce((a,e)=>a+e.amount,0) })
      });
      const data = await res.json();
      setInsights(data.insights);
    } catch (err) {
      setInsights([{ type: 'info', text: 'Could not connect to backend. Make sure your server is running!' }]);
    }
    setInsightsLoading(false);
  };

  const total = expenses.reduce((a, e) => a + e.amount, 0);
  const topCat = Object.keys(CAT_COLORS).sort((a, b) =>
    expenses.filter(e=>e.category===b).reduce((s,e)=>s+e.amount,0) -
    expenses.filter(e=>e.category===a).reduce((s,e)=>s+e.amount,0)
  )[0];

  if (loading) return <div className="loading">Loading...</div>;

  if (!user) return (
    <div className="login-page">
      <h1>💰 SpendSmart</h1>
      <p>Track expenses &amp; get AI insights</p>
      <button className="google-btn" onClick={signIn}>
        <img src="https://www.google.com/favicon.ico" width="18" alt="Google" /> Sign in with Google
      </button>
      <p style={{fontSize:'11px',color:'#bbb',marginTop:'16px'}}>Powered by Firebase Authentication</p>
    </div>
  );

  return (
    <div className="app">
      <div className="header">
        <div className="logo">💰 SpendSmart</div>
        <div className="user-info">
          <img src={user.photoURL} width="28" style={{borderRadius:'50%'}} alt="avatar" />
          <span>{user.displayName}</span>
          <button className="btn btn-danger" onClick={logOut}>Sign out</button>
        </div>
      </div>

      <div className="tabs">
        {['dashboard','expenses','insights'].map(t => (
          <button key={t} className={`tab ${activeTab===t?'active':''}`} onClick={()=>setActiveTab(t)}>
            {t.charAt(0).toUpperCase()+t.slice(1)}
          </button>
        ))}
      </div>

      {activeTab === 'dashboard' && (
        <div>
          <div className="metrics">
            <div className="metric">
              <div className="metric-label">Total spent</div>
              <div className="metric-value">₹{total.toLocaleString()}</div>
            </div>
            <div className="metric">
              <div className="metric-label">Transactions</div>
              <div className="metric-value">{expenses.length}</div>
            </div>
            <div className="metric">
              <div className="metric-label">Top category</div>
              <div className="metric-value" style={{fontSize:'18px'}}>{topCat}</div>
            </div>
          </div>
          <div className="card">
            <h3>Spending by category</h3>
            {expenses.length === 0
              ? <p style={{color:'#aaa',fontSize:'13px'}}>Add some expenses to see your chart!</p>
              : <canvas id="barChart" height="200"></canvas>
            }
          </div>
        </div>
      )}

      {activeTab === 'expenses' && (
        <div className="grid2">
          <div className="card">
            <h3>Add expense</h3>
            <input placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} />
            <input placeholder="Amount (₹)" type="number" value={amount} onChange={e=>setAmount(e.target.value)} />
            <select value={category} onChange={e=>setCategory(e.target.value)}>
              {Object.keys(CAT_COLORS).map(c=><option key={c}>{c}</option>)}
            </select>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
            <button className="btn btn-primary" style={{width:'100%',padding:'10px'}} onClick={addExpense}>
              Add to Firestore ☁️
            </button>
          </div>
          <div className="card">
            <h3>Your expenses</h3>
            {expenses.slice().reverse().map(e=>(
              <div key={e.id} className="expense-item">
                <div>
                  <span className="cat-dot" style={{background:CAT_COLORS[e.category]}}></span>
                  {e.title}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                  <strong>₹{e.amount}</strong>
                  <button className="del-btn" onClick={()=>deleteExpense(e.id)}>×</button>
                </div>
              </div>
            ))}
            {!expenses.length && <p style={{color:'#aaa',fontSize:'13px'}}>No expenses yet!</p>}
          </div>
        </div>
      )}

      {activeTab === 'insights' && (
        <div className="card">
          <h3>AI insights (powered by Gemini)</h3>
          <button className="btn btn-primary" onClick={getInsights} style={{marginBottom:'16px'}}>
            {insightsLoading ? 'Analyzing...' : '✨ Get AI suggestions'}
          </button>
          {insights.map((i,idx)=>(
            <div key={idx} className={`insight ${i.type}`}>
              <span>{i.type==='warn'?'⚠️':i.type==='good'?'✅':'ℹ️'}</span>
              {i.text}
            </div>
          ))}
          {!insights.length && <p style={{color:'#aaa',fontSize:'13px'}}>Click the button to get personalized suggestions based on your spending!</p>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
